id: web-i18n-jsx-text
valid:
- const title = translated;
invalid:
- "// Suppression semantics inside JSX: a JSX comment expression carrying the ignore directive is\n// NOT an ignore\
  \ comment for ast-grep, so nothing inside JSX markup can be suppressed. Each\n// attempt below is reported as\
  \ `unused-suppression` and the violation still fires. Restructure\n// the markup or move the copy to the translation\
  \ table instead.\nexport function Cases() {\n  return (\n    <div>\n      {/* ast-grep-ignore: web-i18n-jsx-text\
  \ FIRE: unused-suppression */}\n      <p>Still reported after a comment on the previous line</p>{/* FIRE: web-i18n-jsx-text\
  \ */}\n      {/* ast-grep-ignore: web-i18n-jsx-attr FIRE: unused-suppression */}\n      <button title=\"Attribute\
  \ suppression does not work\" type=\"button\" />{/* FIRE: web-i18n-jsx-attr */}\n      {/* ast-grep-ignore: web-i18n-jsx-string-expression\
  \ FIRE: unused-suppression */}\n      <p>{'String expression suppression does not work'}</p>{/* FIRE: web-i18n-jsx-string-expression\
  \ */}\n    </div>\n  );\n}\n"
